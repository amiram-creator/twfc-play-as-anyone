; Key bindings added to [Engine.PlayerInput] (PC-TransInput.ini inside Coalesced.ini) by install.py.
; Each runs a console command. The game's console UI is disabled, but bound commands still run.
;
; F11 is required: the mod hooks the native behind CheatManager.Teleport and turns it into the tractor grab.
Bindings=(Name="F11",Command="Teleport")
; F12 is required: the mod redirects the native behind CheatManager.ToggleDebugCamera; it spawns the sky arena (the mod presses
; F12 itself once) and then switches you between the sky arena and the mission's spawn point.
Bindings=(Name="F12",Command="ToggleDebugCamera")
; F8 = God. The mod presses it once after you spawn as Omega (and reads the god flag for the guide panel).
Bindings=(Name="F8",Command="God")
; F4 = load Iacon (D3A) as Megatron; the DLC pack loads Omega Supreme's packages with it.
Bindings=(Name="F4",Command="open D3A_IAC_Base_m?GameTeamStatus=4?IconicMode=1")
; F2 = Omega's shooting-frenzy arm.
Bindings=(Name="F2",Command="giveweapon TransContent.TnWeaponOmegaShootingFrenzyArm")
; F6 / F7 = slow motion on / off (nice for videos).
Bindings=(Name="F6",Command="Slomo 0.25")
Bindings=(Name="F7",Command="Slomo 1")
